<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXTHEALER | Buying List</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
  <script src="js/cart.js" defer></script>
  <script src="js/print.js" defer></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
    integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLus+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    defer></script>
  <script src="js/pdf-download.js" defer></script>
</head>
<body class="print-page">
  <div id="pdf-content">
  <header class="print-header">
    <a class="logo-circle" href="products.html" aria-label="Back to products">LOGO</a>
    <div class="print-header-text">
      <h1>NEXTHEALER - PRODUCT BUYING LIST</h1>
      <p id="print-date"></p>
    </div>
  </header>

  <main class="print-table-wrapper">
    <table class="buying-table">
      <thead>
        <tr>
          <th class="col-num">#</th>
          <th class="col-name">PRODUCT NAME</th>
          <th class="col-qty">QTY</th>
          <th class="col-price">UNIT PRICE</th>
          <th class="col-subtotal">SUBTOTAL</th>
        </tr>
      </thead>
      <tbody id="print-table-body"></tbody>
      <tfoot>
        <tr class="summary-row">
          <td colspan="4" class="no-border-cell">GST 10%</td>
          <td id="gst-value" class="total-box-cell">₹0</td>
        </tr>
        <tr class="summary-row">
          <td colspan="4" class="no-border-cell">GENERATED TOTAL</td>
          <td id="generated-total-value" class="total-box-cell">₹0</td>
        </tr>
      </tfoot>
    </table>
  </main>
  </div>

  <div class="print-footer-actions no-print">
    <a class="theme-btn" href="products.html">BACK TO PRODUCTS</a>
    <button class="theme-btn" id="print-button" type="button">PRINT</button>
    <button class="theme-btn" id="download-pdf-button" type="button">DOWNLOAD PDF</button>
  </div>
</body>
</html>
